[package]
name = "ctfcollab"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "multipart"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
tower-http = { version = "0.6.11", features = ["trace", "cors"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
tracing = "0.1.44" # Logging crate
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros"] }
yrs     = "0.25.0"
bytes   = "1.11.1"
futures = "0.3.32"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
bcrypt = "0.19.1"
uuid = { version = "1.23.1", features = ["v4"] }
chrono = "0.4.44"
reqwest = { version = "0.13.3", features = ["json"] }
tower_governor = "0.8.0"

[profile.release]
#opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
incremental = false
