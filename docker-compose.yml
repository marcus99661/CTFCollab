services:
  db:
    image: postgres:18-alpine
    container_name: ctf_db
    restart: always
    env_file: .env
    volumes:
      - ./db_data:/var/lib/postgresql
      - ./db_init/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    networks:
      - backend_network
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf -d ctfpad"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    image: marcus99661/ctfcollab-backend:latest
    container_name: ctf_backend
    restart: always
    pull_policy: always
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      RUST_LOG: info,tower_http=info
      APP_ADDR: 0.0.0.0:3000
    volumes:
      - ./backend/config.yml:/app/config.yml:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_network

  frontend:
    image: marcus99661/ctfcollab-frontend:latest
    container_name: ctf_frontend
    restart: always
    pull_policy: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge